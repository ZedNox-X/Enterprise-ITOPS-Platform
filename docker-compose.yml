services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://itops:itops@postgres:5432/itops
      RABBITMQ_URL: amqp://itops:itops@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - rabbitmq
      - redis

  worker:
    build: .
    command: python -m app.workers.diagnostic_worker
    environment:
      DATABASE_URL: postgresql+psycopg://itops:itops@postgres:5432/itops
      RABBITMQ_URL: amqp://itops:itops@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - rabbitmq
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: itops
      POSTGRES_USER: itops
      POSTGRES_PASSWORD: itops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
